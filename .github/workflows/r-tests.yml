name: R tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Test recipes and RNA-seq inputs
        run: |
          Rscript tests/run_tests.R
          Rscript tests/test_rnaseq_inputs.R
          Rscript tests/test_fastq_qc.R
      - name: Install DESeq2
        run: |
          Rscript -e 'install.packages("BiocManager")'
          Rscript -e 'BiocManager::install("DESeq2", ask = FALSE, update = FALSE)'
      - name: Run complete RNA-seq example
        run: Rscript workflows/rnaseq/run.R workflows/rnaseq/example/counts.csv workflows/rnaseq/example/samples.csv /tmp/rnaseq-example-output control treated
